<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale Management</title>
    <link rel="stylesheet" href="../../static/css/mobile_style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="nav">
        <a href="{% url 'orders' %}" class="nav-link">Go to Order Management</a>
      </div>

      <div class="content-block">
        <h2 class="section-header">🛒 Sale Form</h2>
        <form action="#" method="POST" class="form-grid">
          <div class="form-group span-2">
            <label for="sale_id">Sale ID:</label>
            <input
              type="text"
              id="sale_id"
              name="sale_id"
              readonly
              value="S003"
              class="read-only"
            />
          </div>

          <div class="form-group span-2">
            <label for="seller_name">Seller Name:</label>
            <input type="text" id="seller_name" name="seller_name" required />
          </div>

          <div class="form-group span-2">
            <label for="shop_name">Shop Name:</label>
            <input type="text" id="shop_name" name="shop_name" required />
          </div>

          <div class="form-group span-2">
            <label for="customer_name">Customer Name:</label>
            <input
              type="text"
              id="customer_name"
              name="customer_name"
              required
            />
          </div>

          <div class="form-group">
            <label for="qty">Quantity (Qty):</label>
            <input type="number" id="qty" name="qty" min="1" required />
          </div>

          <div class="form-group">
            <label for="price">Price (per unit):</label>
            <input
              type="number"
              id="price"
              name="price"
              step="0.01"
              min="0"
              required
            />
          </div>

          <div class="form-group span-2">
            <label for="status">Payment Status:</label>
            <select id="status" name="status" required>
              <option value="cash" selected>Cash</option>
              <option value="debit">Debit</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="remark">Remark:</label>
            <textarea id="remark" name="remark" rows="3"></textarea>
          </div>

          <button type="submit" class="full-width action-button">
            Record Sale
          </button>
        </form>
      </div>

      <div class="content-block">
        <h2 class="section-header">📊 Recent Sales Table</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Seller Name</th>
              <th>Shop Name</th>
              <th>Customer Name</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Status</th>
              <th>Remark</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>S001</td>
              <td>Aung Aung</td>
              <td>Main Store</td>
              <td>Maung Maung</td>
              <td>2</td>
              <td>5000</td>
              <td>cash</td>
              <td>-</td>
            </tr>
            <tr>
              <td>S002</td>
              <td>Khin Myat</td>
              <td>Branch 1</td>
              <td>Aye Aye</td>
              <td>5</td>
              <td>15000</td>
              <td>debit</td>
              <td>New customer</td>
            </tr>
            <tr>
              <td>S002</td>
              <td>mg mg</td>
              <td>Branch 7</td>
              <td>Aye Aye</td>
              <td>5</td>
              <td>15000</td>
              <td>debit</td>
              <td>New customer</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
